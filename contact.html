<header class="page-header">
<h1>Get In Touch ♡</h1>
<p>We would love to hear from you!</p>
</header>

<section class="section">
<div class="info-box">
<h2>Contact Us 🌷</h2>
<p>Have a question about our products? Send us a message!</p>

<form onsubmit="sendContact(event)">
    <div class="field">
        <label>Your Name</label>
        <input type="text" id="contact-name" required placeholder="Enter your name">
    </div>

    <div class="field">
        <label>Your Email</label>
        <input type="email" id="contact-email" required placeholder="Enter your email">
    </div>

    <div class="field">
        <label>Your Message</label>
        <textarea id="contact-message" required placeholder="Write your message here..."></textarea>
    </div>

    <button type="submit" class="btn">Send Message ♡</button>
</form>
</div>
</section>

<footer>♡ Rosé Belle Boutique ♡<br>We're happy to help you!</footer>
<script src="script.js"></script>
</body>
